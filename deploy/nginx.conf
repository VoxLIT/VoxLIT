# Serves the built frontend at / and forwards /api/* to the FastAPI backend.
# One origin for both means the session cookie is first-party (works in Safari)
# and no CORS setup is needed.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    access_log off;

    client_max_body_size 200m;

    server {
        listen 8080;
        root /app/Frontend/dist;

        location /api/ {
            # Trailing slash strips the /api prefix: /api/health -> /health
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_buffering off;
        }

        # React Router (BrowserRouter): unknown paths fall back to the app shell.
        location / {
            try_files $uri /index.html;
        }
    }
}
